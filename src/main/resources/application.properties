APPLICATION_NAME=ms-account-reservation
SERVER_PORT=8080

DATABASE_HOST=localhost
DATABASE_PORT=5432
DATABASE_NAME=account_reservation
DATABASE_USER=postgres
DATABASE_PASSWORD=asterisk

LIQUIBASE_ENABLED=true
LIQUIBASE_CHANGE_LOG=classpath:db/changelog/db.changelog-master.yaml
LIQUIBASE_DEFAULT_SCHEMA=public

JPA_DDL_AUTO=validate
JPA_SHOW_SQL=false
JPA_FORMAT_SQL=true

LOG_LEVEL_ROOT=INFO
LOG_LEVEL_APPLICATION=DEBUG
LOG_FILE_PATH=logs

MANAGEMENT_SERVER_PORT=8081
MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info,threaddump
MANAGEMENT_HEALTH_SHOW_DETAILS=never
SHUTDOWN_TIMEOUT=20s

