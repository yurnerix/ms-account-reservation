spring:
  datasource:
    url: "jdbc:postgresql://${TEST_DATABASE_HOST:localhost}:${TEST_DATABASE_PORT:5432}/${TEST_DATABASE_NAME:account_reservation_test}"
    username: ${TEST_DATABASE_USER:postgres}
    password: ${TEST_DATABASE_PASSWORD:asterisk}
    driver-class-name: org.postgresql.Driver

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: public

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO
    by.yurnerix.msaccountreservation: DEBUG