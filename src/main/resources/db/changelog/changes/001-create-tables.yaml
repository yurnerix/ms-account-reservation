databaseChangeLog:
  - changeSet:
      id: 001-create-account-status
      author: yurnerix
      changes:
        - createTable:
            tableName: account_status
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: pk_account_status

              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_account_status_name

              - column:
                  name: description
                  type: VARCHAR(255)
                  constraints:
                    nullable: false


  - changeSet:
      id: 002-create-client
      author: yurnerix
      changes:
        - createTable:
            tableName: client
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: pk_client

              - column:
                  name: full_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: citizenship
                  type: VARCHAR(100)

              - column:
                  name: client_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: document_number
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: document_series
                  type: VARCHAR(100)

              - column:
                  name: document_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: mdm_code
                  type: BIGINT
                  constraints:
                    nullable: false

  - changeSet:
      id: 003-create-account
      author: yurnerix
      changes:
        - createTable:
            tableName: account
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: pk_account

              - column:
                  name: status_id
                  type: INT
                  constraints:
                    nullable: false

              - column:
                  name: client_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: account_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: currency_code
                  type: VARCHAR(3)
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            constraintName: fk_account_status
            baseTableName: account
            baseColumnNames: status_id
            referencedTableName: account_status
            referencedColumnNames: id

        - addForeignKeyConstraint:
            constraintName: fk_account_client
            baseTableName: account
            baseColumnNames: client_id
            referencedTableName: client
            referencedColumnNames: id

        - createIndex:
            indexName: idx_account_status_id
            tableName: account
            columns:
              - column:
                  name: status_id

        - createIndex:
            indexName: idx_account_client_id
            tableName: account
            columns:
                column:
                  name: client_id






