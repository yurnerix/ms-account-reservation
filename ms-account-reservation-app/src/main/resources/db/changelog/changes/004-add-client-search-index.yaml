databaseChangeLog:
  - changeSet:
      id: 006-enable-pg-trgm
      author: yurnerix

      changes:
        - sql:
            dbms: postgresql
            sql: CREATE EXTENSION IF NOT EXISTS pg_trgm;

  - changeSet:
      id: 007-create-client-last-name-trgm-index
      author: yurnerix

      changes:
        - sql:
            dbms: postgresql
            sql: |
              CREATE INDEX idx_client_lower_last_name_trgm
              ON client
              USING gin (lower(last_name) gin_trgm_ops);

      rollback:
        - sql:
            dbms: postgresql
            sql: DROP INDEX IF EXISTS idx_client_lower_last_name_trgm;