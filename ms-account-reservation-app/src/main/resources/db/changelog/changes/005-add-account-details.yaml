databaseChangeLog:
  - changeSet:
      id: 008-add-account-number-and-balance
      author: yurnerix

      changes:
        - addColumn:
            tableName: account
            columns:
              - column:
                  name: account_number
                  type: VARCHAR(34)
                  constraints:
                    nullable: true

              - column:
                  name: balance
                  type: NUMERIC(19,4)
                  constraints:
                    nullable: true
