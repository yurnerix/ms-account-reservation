spring:
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}

  application:
    name: ${APPLICATION_NAME:ms-account-reservation}

  datasource:
    url: "jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:account_reservation}"
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:asterisk}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}

  cache:
    type: redis
    cache-names: exchangeRates
    redis:
      time-to-live: ${CACHE_EXCHANGE_RATES_TTL:30m}
      cache-null-values: false

  liquibase:
    enabled: ${LIQUIBASE_ENABLED:true}
    change-log: ${LIQUIBASE_CHANGE_LOG:classpath:db/changelog/db.changelog-master.yaml}
    default-schema: ${LIQUIBASE_DEFAULT_SCHEMA:public}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:true}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    admin:
      fail-fast: true

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 10
      properties:
          "[enable.idempotence]": true
          "[max.in.flight.requests.per.connection]": 5
          "[delivery.timeout.ms]": 10000
          "[request.timeout.ms]": 5000
          "[max.block.ms]": 5000
          "[linger.ms]": 0

    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:ms-account-reservation-client-events-v1}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
      max-poll-records: 10

    listener:
      ack-mode: manual_immediate
      concurrency: ${KAFKA_CONCURRENCY:3}
      auto-startup: ${app.kafka.enabled:true}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    by.yurnerix.msaccountreservation: ${LOG_LEVEL_APPLICATION:DEBUG}
  file:
    path: ${LOG_FILE_PATH:logs}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}

  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,threaddump,metrics,prometheus}

  endpoint:
    health:
      access: read-only
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS:never}

    info:
      access: read-only

    threaddump:
      access: read-only

    shutdown:
      access: none

  prometheus:
    metrics:
      export:
        enabled: ${MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED:true}
app:
  async:
    core-pool-size: ${ASYNC_CORE_POOL_SIZE:3}
    max-pool-size: ${ASYNC_MAX_POOL_SIZE:6}
    queue-capacity: ${ASYNC_QUEUE_CAPACITY:100}
    task-timeout: ${ASYNC_TASK_TIMEOUT:5s}

  kafka:
    enabled: ${KAFKA_ENABLED:true}
    client-events-topic: ${KAFKA_CLIENT_EVENTS_TOPIC:client-changed.v1}
    partitions: ${KAFKA_PARTITIONS:3}
    replication-factor: ${KAFKA_REPLICATION_FACTOR:1}

    outbox-batch-size: ${KAFKA_OUTBOX_BATCH_SIZE:20}
    outbox-poll-interval-ms: ${KAFKA_OUTBOX_POLL_INTERVAL_MS:1000}
    outbox-retry-delay-ms: ${KAFKA_OUTBOX_RETRY_DELAY_MS:5000}
    outbox-send-timeout-ms: ${KAFKA_OUTBOX_SEND_TIMEOUT_MS:15000}

  currency-client:
    enabled: ${CURRENCY_CLIENT_ENABLED:true}
    base-url: ${CURRENCY_CLIENT_BASE_URL:https://v6.exchangerate-api.com/v6}
    api-key: ${CURRENCY_CLIENT_API_KEY:}
    connect-timeout: ${CURRENCY_CLIENT_CONNECT_TIMEOUT:2s}
    read-timeout: ${CURRENCY_CLIENT_READ_TIMEOUT:5s}

    retry:
      enabled: ${CURRENCY_CLIENT_RETRY_ENABLED:true}
      max-attempts: ${CURRENCY_CLIENT_RETRY_MAX_ATTEMPTS:3}
      initial-interval: ${CURRENCY_CLIENT_RETRY_INITIAL_INTERVAL:200ms}
      multiplier: ${CURRENCY_CLIENT_RETRY_MULTIPLIER:2.0}
      max-interval: ${CURRENCY_CLIENT_RETRY_MAX_INTERVAL:2s}

    health:
      enabled: ${CURRENCY_CLIENT_HEALTH_ENABLED:true}
